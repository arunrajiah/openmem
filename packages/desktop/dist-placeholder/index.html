<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMem</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1115;
        color: #e6e8ec;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #6ea8fe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .status {
        font-size: 0.85rem;
        opacity: 0.6;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">OpenMem</div>
      <div class="spinner"></div>
      <div class="status" id="status">Starting companion…</div>
    </div>
    <script>
      // The companion sidecar serves both the API and the web UI on
      // 127.0.0.1:7410. This placeholder waits for it to come up, then
      // navigates the window to the real UI.
      const COMPANION = "http://127.0.0.1:7410";
      const statusEl = document.getElementById("status");
      let attempts = 0;

      async function waitForCompanion() {
        attempts++;
        try {
          const res = await fetch(`${COMPANION}/health`, { cache: "no-store" });
          if (res.ok) {
            window.location.replace(COMPANION);
            return;
          }
        } catch {
          // not up yet
        }
        if (attempts > 60) {
          statusEl.textContent =
            "Could not reach the companion. Check the app logs.";
          return;
        }
        setTimeout(waitForCompanion, 500);
      }

      waitForCompanion();
    </script>
  </body>
</html>
