[package]
name = "openmem-desktop"
version = "0.0.0"
description = "OpenMem desktop app"
authors = ["OpenMem contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openmem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri dev` / `tauri build` to toggle the custom protocol.
custom-protocol = ["tauri/custom-protocol"]
